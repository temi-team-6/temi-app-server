name: server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: temi
          POSTGRES_PASSWORD: temi
          POSTGRES_DB: temi_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U temi -d temi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run poe lint
      - run: uv run poe typecheck
      - run: uv run poe test

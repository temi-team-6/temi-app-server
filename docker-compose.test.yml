# 테스트 전용 DB. 운영 compose와 분리해 .env 없이도 뜨고, 데이터는 메모리(tmpfs)에만 둔다.
# 사용: cd server && uv run poe db-test
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temi
      POSTGRES_PASSWORD: temi
      POSTGRES_DB: temi_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temi -d temi_test"]
      interval: 2s
      timeout: 3s
      retries: 30

[project]
name = "temi-server"
version = "0.1.0"
description = "Temi 이중과제 보행 검사 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.poe.tasks]
db-test = { cmd = "docker compose -f ../docker-compose.test.yml -p temi-test up -d --wait", help = "테스트용 Postgres(55432) 띄우기" }
lint = { cmd = "ruff check app migrations tests", help = "린트" }
typecheck = { cmd = "pyright app", help = "타입 검사" }
test = { cmd = "pytest", help = "테스트 (마이그레이션 검사 포함, db-test 필요)" }
check = { sequence = ["lint", "typecheck", "test"], help = "PR 전에 돌리는 전체 검사" }
